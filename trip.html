<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>여행 상세</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap narrow">
    <a class="back" href="index.html">← 여행 목록</a>
    <div id="app"></div>
  </div>

  <script src="trips.js"></script>
  <script src="common.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get("id");
    const t = (window.TRIPS || []).find(x => x.id === id);
    const app = document.getElementById("app");
    const has = a => Array.isArray(a) && a.length > 0;

    if (!t) {
      app.innerHTML = `<p class="empty">여행을 찾을 수 없어요. <a href="index.html">목록으로</a></p>`;
    } else {
      document.title = `${t.title} · 여행 계획`;
      const prepCount = (t.pending || []).length;

      // ---- 일정 탭 ----
      const scheduleHtml = (t.days || []).map((d, i) => `
        <article class="daycard">
          <header>
            <div class="daynum">DAY ${i + 1}</div>
            <div class="daydate">${shortDate(d.date)}</div>
            <h2>${esc(d.title)}</h2>
            ${d.car ? `<span class="carpill">🚗 렌트카</span>` : ""}
          </header>
          <ol class="steps">${(d.steps || []).map(s => `
            <li>
              <span class="when">${esc(s.time || "")}</span>
              <span class="icon">${esc(s.icon || "•")}</span>
              <span class="what">${esc(s.text)}${s.sub ? `<small>${esc(s.sub)}</small>` : ""}</span>
            </li>`).join("")}
          </ol>
          ${d.stay ? `<footer class="stay">🛏️ <span>${esc(d.stay)}</span></footer>` : ""}
        </article>`).join("");

      // ---- 준비 탭 ----
      const store = "check:" + t.id;
      let saved = {};
      try { saved = JSON.parse(localStorage.getItem(store)) || {}; } catch (e) {}

      const prepHtml = `
        ${has(t.pending) ? `
          <section class="panel pending">
            <h2>아직 정해지지 않은 것</h2>
            <ul>${t.pending.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
          </section>` : ""}
        ${has(t.decided) ? `
          <section class="panel decided">
            <h2>정해진 것</h2>
            <ul>${t.decided.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
          </section>` : ""}
        ${has(t.checklist) ? `
          <section class="panel">
            <h2>준비물</h2>
            <ul class="check">${t.checklist.map((c, i) =>
              `<li><label><input type="checkbox" data-i="${i}" ${saved[i] ? "checked" : ""}>${esc(c)}</label></li>`).join("")}</ul>
          </section>` : ""}
        ${has(t.tips) ? `
          <section class="panel">
            <h2>알아둘 것</h2>
            <ul>${t.tips.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
          </section>` : ""}`;

      app.innerHTML = `
        <div class="hero">
          <div class="hero-emoji">${esc(t.emoji || "📍")}</div>
          <h1>${esc(t.title)}</h1>
          <div class="meta">${[dateRange(t.start, t.end), esc(t.people)].filter(Boolean).join(" · ")}</div>
          ${has(t.route) ? `<div class="route">${t.route.map(r => `<span class="stop">${esc(r)}</span>`).join(`<span class="arrow">→</span>`)}</div>` : ""}
        </div>
        <div class="tabs" role="tablist">
          <button role="tab" data-tab="schedule">일정</button>
          <button role="tab" data-tab="prep">준비 · 미정${prepCount ? ` <span class="count">${prepCount}</span>` : ""}</button>
        </div>
        <div data-pane="schedule">${scheduleHtml}</div>
        <div data-pane="prep">${prepHtml}</div>`;

      function show(tab) {
        app.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
        app.querySelectorAll("[data-pane]").forEach(p => p.hidden = p.dataset.pane !== tab);
      }
      app.querySelector(".tabs").addEventListener("click", e => {
        const b = e.target.closest("[data-tab]");
        if (!b) return;
        history.replaceState(null, "", b.dataset.tab === "prep" ? "#prep" : location.pathname + location.search);
        show(b.dataset.tab);
      });
      show(location.hash === "#prep" ? "prep" : "schedule");

      // 체크 상태는 이 브라우저에만 저장됩니다
      app.addEventListener("change", e => {
        if (!e.target.matches("ul.check input")) return;
        const state = {};
        app.querySelectorAll("ul.check input").forEach(cb => { if (cb.checked) state[cb.dataset.i] = 1; });
        try { localStorage.setItem(store, JSON.stringify(state)); } catch (err) {}
      });
    }

    function shortDate(d) {
      if (!d) return "";
      const [y, m, day] = d.split("-").map(Number);
      return `${m}/${day} ${"일월화수목금토"[new Date(y, m - 1, day).getDay()]}`;
    }
  </script>
</body>
</html>
